<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A0A12" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0A0A12"/>
  <circle cx="256" cy="256" r="190" fill="url(#core)"/>
  <!-- portal externo -->
  <polygon points="256,78 434,256 256,434 78,256" fill="none" stroke="url(#g)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- portal interno -->
  <polygon points="256,124 388,256 256,388 124,256" fill="none" stroke="url(#g)" stroke-width="3" stroke-opacity="0.6"/>
  <!-- pontos nos cantos -->
  <g fill="#00D4FF" filter="url(#glow)">
    <circle cx="256" cy="78" r="7"/><circle cx="434" cy="256" r="7"/>
    <circle cx="256" cy="434" r="7"/><circle cx="78" cy="256" r="7"/>
  </g>
  <!-- runa S -->
  <polyline points="300,182 214,214 298,298 212,330" fill="none" stroke="#E8F7FF" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  <line x1="300" y1="168" x2="300" y2="196" stroke="#E8F7FF" stroke-width="10" filter="url(#glow)"/>
  <line x1="212" y1="316" x2="212" y2="344" stroke="#E8F7FF" stroke-width="10" filter="url(#glow)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
