<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEM</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0A12; color: #E8F7FF; font-family: system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; text-align: center; }
  img { width: 160px; height: 160px; }
  h1 { margin: 0; font-size: 1.3rem; color: #00D4FF; text-shadow: 0 0 12px #00D4FF88; letter-spacing: 1px; }
  p { margin: 0; color: #8A9BB0; }
</style>
</head>
<body>
<main>
  <img src="./design/logo-system.svg" alt="Logo do SYSTEM">
  <h1>SYSTEM: PORTAL EM CONSTRUÇÃO</h1>
  <p id="data"></p>
</main>
<script>
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, "0"); };
  document.getElementById("data").textContent = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear();
</script>
</body>
</html>
